<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>314Sign Remote - Device Registration</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; background:#000; color:#fff; font-family:monospace; }
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

    .container { max-width:90%; padding:2rem; }

    .title {
      font-size: clamp(2rem, 8vw, 6rem);
      margin-bottom: 2rem;
      color: #00ff00;
      text-shadow: 0 0 20px rgba(0,255,0,0.5);
    }

    .device-code {
      font-size: clamp(5rem, 25vw, 20rem);
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #ffff00;
      text-shadow: 0 0 30px rgba(255,255,0,0.8);
      margin: 2rem 0;
      border: 4px solid #ffff00;
      padding: 1rem;
      border-radius: 1rem;
      background: rgba(255,255,0,0.1);
    }

    .instructions {
      font-size: clamp(1.5rem, 4vw, 3rem);
      margin: 2rem 0;
      line-height: 1.4;
    }

    .status {
      font-size: clamp(1rem, 2.5vw, 2rem);
      margin-top: 2rem;
      color: #888;
    }

    .qr-code {
      margin-top: 2rem;
      max-width: 200px;
      opacity: 0.7;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .device-code {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">314Sign Remote Device</div>

    <div class="device-code" id="deviceCode">Loading...</div>

    <div class="instructions">
      Register this device with your main 314Sign kiosk<br>
      using the code shown above.
    </div>

    <div class="status" id="status">Checking registration status...</div>

    <img id="qrCode" class="qr-code" src="qr-emergency-admin.png" alt="Emergency Admin QR" style="display:none;" />
  </div>

  <script>
    let deviceCode = 'UNKNOWN';
    let mainKioskUrl = null;
    let pollInterval;
    let wsConnection = null;
    let wsHeartbeatInterval = null;
    let contentCache = null;
    let isInSyncMode = false;
    let lastMasterPing = null;

    // Load device information
    async function loadDeviceInfo() {
      try {
        const response = await fetch('/device.json');
        if (response.ok) {
          const device = await response.json();
          deviceCode = device.code || 'UNKNOWN';
          document.getElementById('deviceCode').textContent = deviceCode;
        }
      } catch (error) {
        console.error('Failed to load device info:', error);
      }
    }

    // Load remote configuration to get main kiosk URL
    async function loadRemoteConfig() {
      try {
        const response = await fetch('/remote-config.json');
        if (response.ok) {
          const config = await response.json();
          mainKioskUrl = config.mainKioskUrl || null;
          return config;
        }
      } catch (error) {
        console.error('Failed to load remote config:', error);
      }
      return null;
    }

    // Load content cache from localStorage
    function loadContentCache() {
      try {
        const cached = localStorage.getItem(`cache-${deviceCode}`);
        if (cached) {
          return JSON.parse(cached);
        }
      } catch (error) {
        console.error('Failed to load cache:', error);
      }
      return null;
    }

    // Save content cache to localStorage
    function saveContentCache(content) {
      try {
        localStorage.setItem(`cache-${deviceCode}`, JSON.stringify({
          ...content,
          cachedAt: new Date().toISOString()
        }));
        contentCache = content;
      } catch (error) {
        console.error('Failed to save cache:', error);
      }
    }

    // Initialize WebSocket connection for sync mode
    async function initializeSyncMode(config) {
      if (!config || config.mode !== 'master-remote' || !config.syncEnabled) {
        isInSyncMode = false;
        return false;
      }

      isInSyncMode = true;
      const statusEl = document.getElementById('status');
      statusEl.textContent = '📡 Initializing Master Sync...';
      statusEl.style.color = '#4ecdc4';

      try {
        // Fetch initial content bundle
        const contentResponse = await fetch(`${mainKioskUrl}/api/remotes/${deviceCode}/content`, {
          headers: { 'Cache-Control': 'no-cache' }
        });

        if (contentResponse.ok) {
          const content = await contentResponse.json();
          if (content.success) {
            saveContentCache(content.data);
            statusEl.textContent = '📡 Synced - Connecting WebSocket...';
          }
        }
      } catch (error) {
        console.error('Failed to fetch initial content:', error);
        // Try to use cached content
        const cached = loadContentCache();
        if (cached) {
          statusEl.textContent = '📡 Master offline - using cached content';
          statusEl.style.color = '#ff9800';
          setupDisplayFromCache(cached);
          return true;
        }
      }

      // Attempt WebSocket connection
      connectWebSocket(mainKioskUrl);
      return true;
    }

    // Connect to WebSocket for real-time updates
    function connectWebSocket(kioskUrl) {
      try {
        const wsUrl = kioskUrl.replace(/^http/, 'ws') + `/ws/remotes/${deviceCode}`;
        wsConnection = new WebSocket(wsUrl);
        const statusEl = document.getElementById('status');

        wsConnection.onopen = () => {
          console.log('WebSocket connected');
          statusEl.textContent = '📡 Synced with Master';
          statusEl.style.color = '#00ff00';
          lastMasterPing = Date.now();

          // Start heartbeat
          if (wsHeartbeatInterval) clearInterval(wsHeartbeatInterval);
          wsHeartbeatInterval = setInterval(() => {
            if (wsConnection && wsConnection.readyState === 1) {
              wsConnection.send(JSON.stringify({ type: 'heartbeat' }));
              lastMasterPing = Date.now();
            }
          }, 30000);
        };

        wsConnection.onmessage = (event) => {
          try {
            const message = JSON.parse(event.data);
            if (message.type === 'connected') {
              console.log('WebSocket handshake complete');
            } else if (message.type === 'content-update') {
              console.log('Received content update from master');
              saveContentCache(message.data);
              setupDisplayFromCache(message.data);
              wsConnection.send(JSON.stringify({ type: 'cache-update-ack' }));
            }
          } catch (error) {
            console.error('Failed to process WebSocket message:', error);
          }
        };

        wsConnection.onerror = (error) => {
          console.error('WebSocket error:', error);
          statusEl.textContent = '📡 WebSocket error - polling fallback';
          statusEl.style.color = '#ff9800';
        };

        wsConnection.onclose = () => {
          console.log('WebSocket disconnected');
          if (wsHeartbeatInterval) clearInterval(wsHeartbeatInterval);

          const statusEl = document.getElementById('status');
          const cached = loadContentCache();
          if (cached) {
            statusEl.textContent = '📡 Master offline - cached content';
            statusEl.style.color = '#ff9800';
          } else {
            statusEl.textContent = '📡 Sync disconnected - no cache';
            statusEl.style.color = '#dc3545';
          }

          // Attempt reconnection after 10 seconds
          setTimeout(() => {
            if (isInSyncMode) {
              connectWebSocket(mainKioskUrl);
            }
          }, 10000);
        };
      } catch (error) {
        console.error('Failed to connect WebSocket:', error);
      }
    }

    // Set up display from cached/synced content
    function setupDisplayFromCache(data) {
      if (!data || !data.activeMenu) return;

      // In a real implementation, this would render the menu/content
      // For now, this is a placeholder that actual display logic would call
      console.log('Display ready with:', data.activeMenu?.name);

      // Trigger page reload if needed to show actual content
      if (window.location.pathname === '/remclient/' || window.location.pathname === '/remclient/remote.html') {
        // Stay on sync display page
        setTimeout(() => {
          location.reload();
        }, 5000);
      }
    }

    // Toggle sync mode on/off (can be called from device UI)
    async function toggleSyncMode() {
      if (!isInSyncMode) return;

      try {
        const config = await loadRemoteConfig();
        if (!config) return;

        const newSyncState = !config.syncEnabled;
        config.syncEnabled = newSyncState;

        // Save to local config
        try {
          // This would be implemented via a local API endpoint that writes to /remote-config.json
          console.log('Sync mode toggled to:', newSyncState);
        } catch (error) {
          console.error('Failed to toggle sync mode:', error);
        }
      } catch (error) {
        console.error('Failed to toggle sync:', error);
      }
    }

    // Check registration status and initialize sync if needed
    async function checkRegistrationStatus() {
      try {
        // First load the remote config to get the main kiosk URL
        const config = await loadRemoteConfig();

        if (!config) {
          document.getElementById('status').textContent = '⏳ Loading configuration...';
          return;
        }

        const statusEl = document.getElementById('status');

        // Check if in sync mode
        if (config.registered && config.mode === 'master-remote' && config.syncEnabled) {
          await initializeSyncMode(config);
          return;
        }

        if (config.registered && mainKioskUrl) {
          statusEl.textContent = `✅ Registered as "${config.displayName}"`;
          statusEl.style.color = '#00ff00';

          // Stop polling once registered
          if (pollInterval) {
            clearInterval(pollInterval);
          }

          // Show QR code for emergency admin
          document.getElementById('qrCode').style.display = 'block';

          // Reload the page to show the actual remote display
          setTimeout(() => {
            // Check if we should navigate to the actual remote page
            fetch('/page.json')
              .then(r => r.json())
              .then(pj => {
                if (pj.page && pj.page !== 'remote') {
                  window.location.href = '/' + pj.page + '/';
                }
              })
              .catch(() => {
                // Stay on this page if page.json fails
              });
          }, 3000);

        } else if (mainKioskUrl) {
          statusEl.textContent = '⏳ Waiting for registration...';
          statusEl.style.color = '#ffff00';
        } else {
          statusEl.textContent = '⏳ Waiting for main kiosk configuration...';
          statusEl.style.color = '#ffaa00';
        }
      } catch (error) {
        console.error('Failed to check registration:', error);
      }
    }

    // Initialize
    loadDeviceInfo();
    checkRegistrationStatus();

    // Poll for registration status every 5 seconds
    pollInterval = setInterval(checkRegistrationStatus, 5000);

    // Also check when page becomes visible (in case user switches tabs)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        checkRegistrationStatus();
      }
    });

    // Expose toggleSyncMode globally for potential UI controls
    window.toggleSyncMode = toggleSyncMode;
    window.getDeviceCode = () => deviceCode;
  </script>
</body>
</html>
