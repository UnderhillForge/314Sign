<!DOCTYPE html>
<html>
<head>
    <title>Inline Script Test</title>
    <style>
        body {
            background: #222;
            color: white;
            font-size: 48px;
            padding: 50px;
        }
    </style>
</head>
<body>
    <h1>Testing Inline Script</h1>
    <div id="test">Before script runs</div>
    
    <script>
        console.log('Inline script is running!');
        alert('Inline JavaScript executed!');
        document.getElementById('test').textContent = 'Inline script RAN!';
        document.getElementById('test').style.color = 'lime';
    </script>
    
    <div>After script tag</div>
</body>
</html>
