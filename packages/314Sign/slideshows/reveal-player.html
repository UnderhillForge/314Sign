<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>314Sign Slideshow</title>
  
  <!-- Reveal.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/theme/black.css">
  
  <style>
    :root {
      --slide-bg: #000;
      --slide-text: #fff;
    }
    
    .reveal {
      background: var(--slide-bg);
    }
    
    .reveal .slides {
      text-align: center;
    }
    
    /* Slide content styling */
    .slide-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .slide-title {
      font-size: 4rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    
    .slide-subtitle {
      font-size: 2rem;
      opacity: 0.8;
    }
    
    .slide-text {
      font-size: 2.5rem;
      line-height: 1.6;
      max-width: 90%;
    }
    
    .slide-image {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
    }
    
    /* Weather widget */
    .weather-widget {
      display: flex;
      gap: 3rem;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .weather-current {
      text-align: center;
    }
    
    .weather-temp {
      font-size: 6rem;
      font-weight: bold;
    }
    
    .weather-condition {
      font-size: 2rem;
      opacity: 0.9;
    }
    
    .weather-icon {
      font-size: 8rem;
    }
    
    .weather-forecast {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
    }
    
    .forecast-day {
      text-align: center;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
    }
    
    .forecast-day-name {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    
    .forecast-temp {
      font-size: 2rem;
      font-weight: bold;
    }
    
    /* Time widget */
    .time-widget {
      font-size: 8rem;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    
    .date-widget {
      font-size: 3rem;
      margin-top: 2rem;
      opacity: 0.9;
    }
    
    /* Video slide */
    .slide-video {
      max-width: 100%;
      max-height: 85vh;
    }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides" id="slides-container">
      <!-- Slides will be injected here -->
    </div>
  </div>

  <!-- Reveal.js -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  
  <script>
    let slideshowData = null;
    let weatherCache = new Map(); // Cache by location+units
    let weatherUpdateInterval = null;

    // Get slideshow name from URL
    const urlParams = new URLSearchParams(window.location.search);
    const slideshowName = urlParams.get('slideshow');

    if (!slideshowName) {
      document.getElementById('slides-container').innerHTML = 
        '<section><h1>No slideshow specified</h1><p>Add ?slideshow=name to the URL</p></section>';
    } else {
      loadSlideshow(slideshowName);
    }

    async function loadSlideshow(name) {
      try {
        const response = await fetch(`/api/slideshows/${name}`);
        if (!response.ok) throw new Error('Slideshow not found');
        
        const result = await response.json();
        slideshowData = result.data;
        
        // Fetch weather data BEFORE rendering slides if weather widget exists
        if (slideshowData.slides.some(s => s.type === 'weather')) {
          await updateWeather();
        }
        
        await renderSlides();
        initializeReveal();
        
        // Set up periodic weather updates (every 10 minutes)
        if (slideshowData.slides.some(s => s.type === 'weather')) {
          weatherUpdateInterval = setInterval(updateWeather, 10 * 60 * 1000);
        }
        
      } catch (error) {
        console.error('Failed to load slideshow:', error);
        document.getElementById('slides-container').innerHTML = 
          `<section><h1>Error</h1><p>Failed to load slideshow: ${error.message}</p></section>`;
      }
    }

    async function updateWeather() {
      try {
        // Find all unique weather slide configurations
        const weatherSlides = slideshowData.slides.filter(s => s.type === 'weather');
        if (weatherSlides.length === 0) return;
        
        // Fetch weather for each unique location+units combination
        const uniqueConfigs = new Map();
        weatherSlides.forEach(slide => {
          const key = `${slide.location || 'auto'}_${slide.units || 'F'}`;
          if (!uniqueConfigs.has(key)) {
            uniqueConfigs.set(key, {
              location: slide.location || 'auto',
              units: slide.units || 'F'
            });
          }
        });
        
        // Fetch weather data for each config in parallel
        const fetchPromises = Array.from(uniqueConfigs.entries()).map(async ([key, config]) => {
          try {
            const response = await fetch(`/api/weather?location=${encodeURIComponent(config.location)}&units=${config.units}`);
            const result = await response.json();
            if (result.success) {
              weatherCache.set(key, result.data);
              console.log(`Weather cached for ${key}:`, result.data);
            } else {
              console.warn(`Weather API returned error for ${key}:`, result);
            }
          } catch (error) {
            console.error(`Failed to fetch weather for ${key}:`, error);
          }
        });
        
        await Promise.all(fetchPromises);
        
        // Refresh all weather slide content with new data
        refreshWeatherSlides();
      } catch (error) {
        console.error('Failed to update weather:', error);
      }
    }
    
    function refreshWeatherSlides() {
      // Find all weather slide sections in the DOM
      const weatherSections = document.querySelectorAll('section[data-slide-type="weather"]');
      weatherSections.forEach(section => {
        const slideIndex = parseInt(section.getAttribute('data-slide-index'));
        if (!isNaN(slideIndex) && slideshowData.slides[slideIndex]) {
          const slide = slideshowData.slides[slideIndex];
          section.innerHTML = renderWeatherSlide(slide);
        }
      });
      console.log(`Refreshed ${weatherSections.length} weather slide(s) with updated data`);
    }

    async function renderSlides() {
      const container = document.getElementById('slides-container');
      container.innerHTML = '';

      let currentParent = null; // Track current horizontal section for vertical nesting

      for (let i = 0; i < slideshowData.slides.length; i++) {
        const slide = slideshowData.slides[i];
        const section = document.createElement('section');
        
        // Store slide index and type for event handling
        section.setAttribute('data-slide-index', i);
        section.setAttribute('data-slide-type', slide.type);
        
        // Set background color or image
        if (slide.background) {
          if (slide.background.startsWith('#')) {
            section.setAttribute('data-background-color', slide.background);
          } else {
            section.setAttribute('data-background-image', slide.background);
            section.setAttribute('data-background-size', 'cover');
          }
        }
        
        // Set transition
        if (slide.transition) {
          section.setAttribute('data-transition', slide.transition);
        }
        
        // Set auto-slide duration
        if (slide.duration) {
          section.setAttribute('data-autoslide', slide.duration);
        }

        section.className = 'slide-content';
        
        // Render content based on type
        switch (slide.type) {
          case 'text':
            section.innerHTML = renderTextSlide(slide);
            break;
          case 'image':
            section.innerHTML = renderImageSlide(slide);
            break;
          case 'slide':
            section.innerHTML = renderSvgSlide(slide);
            break;
          case 'weather':
            section.classList.add('weather-slide');
            section.innerHTML = renderWeatherSlide(slide);
            break;
          case 'time':
            section.innerHTML = renderTimeSlide(slide);
            startTimeUpdate(section);
            break;
          case 'fact':
            section.innerHTML = renderFactSlide(slide);
            loadFactData(slide, section);
            break;
          case 'history':
            section.innerHTML = renderHistorySlide(slide);
            loadHistoryData(slide, section);
            break;
          case 'html':
            section.innerHTML = slide.content || '';
            break;
          case 'composite':
            section.innerHTML = renderCompositeSlide(slide);
            break;
          default:
            section.innerHTML = '<p>Unknown slide type</p>';
        }
        
        // Handle vertical slides (nested sections)
        if (slide.vertical && currentParent) {
          // If parent has no children yet, we need to convert it to a wrapper
          if (currentParent.children.length === 0 || 
              !currentParent.firstElementChild.tagName === 'SECTION') {
            // Move parent's content into a child section
            const parentContent = currentParent.innerHTML;
            const parentAttrs = {};
            
            // Copy parent's data attributes
            Array.from(currentParent.attributes).forEach(attr => {
              if (attr.name.startsWith('data-')) {
                parentAttrs[attr.name] = attr.value;
              }
            });
            
            currentParent.innerHTML = '';
            const firstChild = document.createElement('section');
            firstChild.className = 'slide-content';
            firstChild.innerHTML = parentContent;
            
            // Copy attributes to first child
            Object.keys(parentAttrs).forEach(key => {
              firstChild.setAttribute(key, parentAttrs[key]);
            });
            
            currentParent.appendChild(firstChild);
          }
          
          // Add this slide as a nested section
          currentParent.appendChild(section);
        } else {
          // This is a horizontal slide
          container.appendChild(section);
          currentParent = section;
        }
      }
    }

    function renderTextSlide(slide) {
      let html = '';
      
      // If markdown is enabled, render as markdown
      if (slide.markdown && slide.content) {
        return marked.parse(slide.content);
      }
      
      // Otherwise render as regular text slide
      if (slide.title) {
        html += `<h1 class="slide-title">${escapeHtml(slide.title)}</h1>`;
      }
      
      if (slide.subtitle) {
        html += `<p class="slide-subtitle">${escapeHtml(slide.subtitle)}</p>`;
      }
      
      if (slide.content) {
        html += `<div class="slide-text">${escapeHtml(slide.content).replace(/\n/g, '<br>')}</div>`;
      }
      
      return html;
    }

    function renderImageSlide(slide) {
      let html = `<img src="${escapeHtml(slide.media)}" class="slide-image" alt="Slide image">`;
      
      if (slide.caption) {
        html += `<p class="slide-subtitle" style="margin-top: 1rem;">${escapeHtml(slide.caption)}</p>`;
      }
      
      return html;
    }

    function renderSvgSlide(slide) {
      if (!slide.svgContent) {
        return '<p>No SVG content available</p>';
      }
      
      // Create a container for the SVG with proper sizing
      return `<div class="svg-slide-container" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto;">
        ${slide.svgContent}
      </div>`;
    }

    function renderWeatherSlide(slide) {
      const location = slide.location || 'auto';
      const units = slide.units || 'F';
      const cacheKey = `${location}_${units}`;
      const data = weatherCache.get(cacheKey);
      
      if (!data) {
        return `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:2rem;">
          <p>🌤️ Loading weather for ${location === 'auto' ? 'your location' : location}...</p>
        </div>`;
      }
      
      const unitSymbol = units === 'C' ? '°C' : '°F';
      const windUnit = units === 'C' ? 'km/h' : 'mph';
      
      // Build weather display with improved styling
      let html = `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:2rem;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
          <!-- Main content: icon on left, location and info on right -->
          <div style="display:flex;align-items:flex-start;gap:3rem;margin-bottom:2rem;width:100%;justify-content:center;">
            <!-- Large icon on left -->
            <div style="flex-shrink:0;">
              <img src="https://openweathermap.org/img/wn/${data.current.icon}@4x.png" alt="${data.current.condition}" style="width:240px;height:240px;filter:drop-shadow(0 0 10px rgba(255,255,255,0.3));">
            </div>
            
            <!-- Info on right -->
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1rem;">
              <!-- Temperature -->
              <div style="font-size:5rem;font-weight:bold;line-height:1;color:#fff;">${data.current.temp}${unitSymbol}</div>
              
              <!-- Location name -->
              <div style="font-size:2rem;font-weight:bold;color:#fff;">${data.location || ''}</div>
              
              <!-- Condition, Humidity, Wind -->
              <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;margin-top:0.5rem;">
                <div style="font-size:2rem;color:#fff;text-align:center;">${data.current.condition}</div>
                <div style="display:flex;gap:3rem;font-size:1.6rem;color:#fff;justify-content:center;">
                  <div style="display:flex;align-items:center;gap:0.5rem;">
                    <span>💧</span>
                    <span>Humidity: ${data.current.humidity}%</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:0.5rem;">
                    <span>💨</span>
                    <span>Wind: ${data.current.windSpeed} ${windUnit}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>`
      
      if (slide.showForecast && data.forecast && data.forecast.length > 0) {
        html += `<div style="display:flex;gap:3rem;justify-content:center;margin-top:3rem;">
          ${data.forecast.map(day => `
            <div style="text-align:center;">
              <div style="font-weight:bold;margin-bottom:1rem;font-size:1.8rem;color:#fff;">${day.day}</div>
              <img src="https://openweathermap.org/img/wn/${day.icon}@4x.png" alt="${day.condition}" style="width:200px;height:200px;margin:0 auto;display:block;filter:drop-shadow(0 0 5px rgba(255,255,255,0.2));">
              <div style="margin-top:1rem;font-size:1.8rem;font-weight:600;color:#fff;">${day.temp}${unitSymbol}</div>
            </div>
          `).join('')}
        </div>`
      }
      
      html += `</div>`;
      return html;
    }

    function renderTimeSlide(slide) {
      return `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;">
          <div class="time-widget" id="time-display">--:--</div>
          <div class="date-widget" id="date-display">Loading...</div>
        </div>
      `;
    }

    function renderFactSlide(slide) {
      const bgColor = slide.backgroundColor || '#1a1a2e';
      const textColor = slide.textColor || '#ffffff';
      
      return `
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:3rem;background-color:${bgColor};color:${textColor};text-align:center;">
          <div style="font-size:3rem;font-weight:bold;margin-bottom:2rem;opacity:0.8;">💡 Random Fact</div>
          <div id="fact-content" style="font-size:3.6rem;line-height:1.6;max-width:90%;font-style:italic;">
            Loading fact...
          </div>
          <div id="fact-source" style="font-size:1rem;margin-top:2rem;opacity:0.7;"></div>
        </div>
      `;
    }

    async function loadFactData(slide, section) {
      const factContent = section.querySelector('#fact-content');
      const factSource = section.querySelector('#fact-source');
      
      let fact = null;
      
      // Try API first
      try {
        const response = await fetch('https://www.thefact.space/random');
        const data = await response.json();
        
        if (data.text) {
          fact = data;
        }
      } catch (error) {
        console.warn('API fetch failed, falling back to local facts:', error);
      }
      
      // If API failed, try fallback
      if (!fact) {
        try {
          const response = await fetch('./facts-fallback.json');
          const fallbackData = await response.json();
          
          if (fallbackData.facts && fallbackData.facts.length > 0) {
            const randomIndex = Math.floor(Math.random() * fallbackData.facts.length);
            fact = fallbackData.facts[randomIndex];
          }
        } catch (fallbackError) {
          console.error('Fallback fetch also failed:', fallbackError);
        }
      }
      
      // Display the fact
      if (fact && factContent) {
        factContent.textContent = fact.text;
        if (fact.source && factSource) {
          factSource.textContent = `— ${fact.source}`;
        }
      } else if (factContent) {
        factContent.textContent = 'Could not fetch fact. Please try again later.';
      }
    }

    function renderHistorySlide(slide) {
      const bgColor = slide.backgroundColor || '#2c1810';
      const textColor = slide.textColor || '#f5deb3';
      const eventType = slide.eventType || 'events';
      const showImages = slide.showImages || false;
      
      let title = '📜 Today in History';
      if (eventType === 'births') title = '🎂 Born on This Day';
      if (eventType === 'deaths') title = '🕯️ Died on This Day';
      
      if (showImages) {
        // Layout with image on left, text on right
        return `
          <div style="display:flex;height:100%;background-color:${bgColor};color:${textColor};">
            <div id="history-image-container" style="flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;background-color:rgba(0,0,0,0.2);">
              <div id="history-image" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;opacity:0.5;">
                Loading image...
              </div>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem;text-align:center;">
              <div style="font-size:2.5rem;font-weight:bold;margin-bottom:2rem;opacity:0.9;">${title}</div>
              <div id="history-date" style="font-size:1.5rem;margin-bottom:1rem;opacity:0.8;">Loading...</div>
              <div id="history-year" style="font-size:2rem;font-weight:bold;margin-bottom:1rem;color:#ffd700;">Loading...</div>
              <div id="history-content" style="font-size:3.5rem;line-height:1.5;max-width:90%;margin-bottom:2rem;">
                Loading historical event...
              </div>
              <div id="history-source" style="font-size:1rem;opacity:0.6;">Source: Wikipedia</div>
            </div>
          </div>
        `;
      } else {
        // Centered text-only layout
        return `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:3rem;background-color:${bgColor};color:${textColor};text-align:center;">
            <div style="font-size:2.5rem;font-weight:bold;margin-bottom:2rem;opacity:0.9;">${title}</div>
            <div id="history-date" style="font-size:1.5rem;margin-bottom:1rem;opacity:0.8;">Loading...</div>
            <div id="history-year" style="font-size:2rem;font-weight:bold;margin-bottom:1rem;color:#ffd700;">Loading...</div>
            <div id="history-content" style="font-size:5rem;line-height:1.5;max-width:90%;margin-bottom:2rem;">
              Loading historical event...
            </div>
            <div id="history-source" style="font-size:1rem;opacity:0.6;">Source: Wikipedia</div>
          </div>
        `;
      }
    }

    async function loadHistoryData(slide, section) {
      const historyDate = section.querySelector('#history-date');
      const historyYear = section.querySelector('#history-year');
      const historyContent = section.querySelector('#history-content');
      const historyImageContainer = section.querySelector('#history-image');
      
      const eventType = slide.eventType || 'events';
      const showImages = slide.showImages || false;
      const now = new Date();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      
      let event = null;
      
      // Try API first
      try {
        const response = await fetch(`https://byabbe.se/on-this-day/${month}/${day}/${eventType}.json`);
        const data = await response.json();
        
        if (data[eventType] && data[eventType].length > 0) {
          // Pick a random event from the list
          const randomIndex = Math.floor(Math.random() * data[eventType].length);
          const selectedEvent = data[eventType][randomIndex];
          event = {
            year: selectedEvent.year,
            description: selectedEvent.description,
            date: data.date,
            wikipedia: selectedEvent.wikipedia || []
          };
        }
      } catch (error) {
        console.warn('History API fetch failed:', error);
      }
      
      // Display the event
      if (event && historyContent) {
        if (historyDate) historyDate.textContent = event.date;
        if (historyYear) historyYear.textContent = event.year;
        historyContent.textContent = event.description;
        
        // Fetch Wikipedia image if enabled and links available
        if (showImages && historyImageContainer && event.wikipedia.length > 0) {
          await loadWikipediaImage(event.wikipedia[0].title, historyImageContainer);
        }
      } else if (historyContent) {
        historyContent.textContent = 'Could not fetch historical event. Please try again later.';
        if (historyYear) historyYear.textContent = '';
        if (historyImageContainer) historyImageContainer.innerHTML = '';
      }
    }
    
    async function loadWikipediaImage(pageTitle, container) {
      try {
        // Fetch page info with thumbnail from Wikipedia API
        const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(pageTitle)}`;
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.thumbnail && data.thumbnail.source) {
          // Use the larger original image if available, otherwise use thumbnail
          const imageUrl = data.originalimage?.source || data.thumbnail.source;
          container.innerHTML = `<img src="${imageUrl}" style="max-width:100%;max-height:100%;object-fit:contain;" alt="${pageTitle}" />`;
        } else {
          container.innerHTML = '<div style="font-size:3rem;opacity:0.3;">📜</div>';
        }
      } catch (error) {
        console.warn('Failed to load Wikipedia image:', error);
        container.innerHTML = '<div style="font-size:3rem;opacity:0.3;">📜</div>';
      }
    }

    function renderCompositeSlide(slide) {
      if (!slide.elements || slide.elements.length === 0) {
        return '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;">Empty slide</div>';
      }
      
      let html = '<div style="position:relative;width:100%;height:100%;">';
      
      slide.elements.forEach(element => {
        const style = `
          position: absolute;
          left: ${element.x}%;
          top: ${element.y}%;
          width: ${element.width}px;
          height: ${element.height}px;
          transform: rotate(${element.rotation || 0}deg);
        `;
        
        if (element.type === 'text') {
          html += `
            <div style="${style}">
              <div style="padding:10px;font-size:${element.fontSize || 24}px;color:${element.color || '#fff'};font-weight:${element.bold ? 'bold' : 'normal'};">
                ${escapeHtml(element.content || '')}
              </div>
            </div>
          `;
        } else if (element.type === 'image') {
          html += `<div style="${style}"><img src="${escapeHtml(element.src)}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else if (element.type === 'weather') {
          html += `<div style="${style}"><div class="weather-widget-composite" data-location="${element.location || 'auto'}"></div></div>`;
        }
      });
      
      html += '</div>';
      return html;
    }

    function startTimeUpdate(section) {
      const updateTime = () => {
        const timeEl = section.querySelector('#time-display');
        const dateEl = section.querySelector('#date-display');
        
        if (timeEl && dateEl) {
          const now = new Date();
          timeEl.textContent = now.toLocaleTimeString('en-US', { 
            hour: '2-digit', 
            minute: '2-digit',
            hour12: true 
          });
          dateEl.textContent = now.toLocaleDateString('en-US', { 
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
          });
        }
      };
      
      updateTime();
      setInterval(updateTime, 1000);
    }

    function renderWeatherContent(slide) {
      const container = slide.querySelector('.weather-widget');
      if (container && weatherCache) {
        container.outerHTML = renderWeatherSlide({});
      }
    }

    function initializeReveal() {
      const config = {
        width: 1920,
        height: 1080,
        margin: 0,
        minScale: 1,
        maxScale: 1,
        controls: false,
        progress: false,
        center: true,
        hash: false,
        transition: slideshowData.defaultTransition || 'slide',
        transitionSpeed: 'default',
        autoSlide: slideshowData.defaultDuration || 5000,
        autoSlideStoppable: false,
        loop: true,
        shuffle: false,
        mouseWheel: false,
        hideInactiveCursor: true,
        hideCursorTime: 1000
      };

      Reveal.initialize(config);
      
      // Reload fact data every time a fact slide is displayed
      Reveal.on('slidechanged', event => {
        const currentSection = event.currentSlide;
        if (currentSection) {
          const slideType = currentSection.getAttribute('data-slide-type');
          const slideIndex = parseInt(currentSection.getAttribute('data-slide-index'));
          
          if (!isNaN(slideIndex) && slideshowData.slides[slideIndex]) {
            if (slideType === 'fact') {
              loadFactData(slideshowData.slides[slideIndex], currentSection);
            } else if (slideType === 'history') {
              loadHistoryData(slideshowData.slides[slideIndex], currentSection);
            }
          }
        }
      });
      
      // Log slideshow started
      console.log('[SLIDESHOW] Reveal.js initialized with', slideshowData.slides.length, 'slides');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      if (weatherUpdateInterval) {
        clearInterval(weatherUpdateInterval);
      }
    });
  </script>
</body>
</html>
