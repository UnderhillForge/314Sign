<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daily Specials - Minimal</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; overflow:hidden; }
    body {
      font-family: 'Comic Sans MS', 'Marker Felt', 'Apple Chancery', cursive;
      color: #fff;
      background: #333;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    header {
      background: rgba(0,0,0,0.5);
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(1.5rem, 5vw, 4rem);
      font-weight: bold;
    }
    #specials {
      flex: 1;
      padding: clamp(1rem, 2vw, 3rem);
      font-size: clamp(1rem, 3vw, 6rem);
      line-height: 1.1;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <header>
    <span>Today's Specials</span>
  </header>
  <div id="specials">Loading…</div>

  <script>
  console.log('[MINIMAL] Script starting');
  const specialsDiv = document.getElementById('specials');
  
  // Test 1: Can we update the DOM?
  specialsDiv.textContent = 'Script is running...';
  console.log('[MINIMAL] DOM updated');
  
  // Test 2: Can we fetch API?
  fetch('/api/menu/dinner')
    .then(r => {
      console.log('[MINIMAL] Fetch response:', r.ok, r.status);
      return r.json();
    })
    .then(data => {
      console.log('[MINIMAL] API data received:', data.success);
      if (data.success && data.data) {
        specialsDiv.textContent = data.data.content || 'No content';
        console.log('[MINIMAL] Content displayed');
      } else {
        specialsDiv.textContent = 'API returned no data';
      }
    })
    .catch(err => {
      console.error('[MINIMAL] Fetch error:', err);
      specialsDiv.textContent = 'Error loading menu: ' + err.message;
      specialsDiv.style.color = 'red';
    });
  </script>
</body>
</html>
